    type: APIReference
  - url: openapi/ing-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized (not public) CDR Banking API surface for saved
    payees. Covers Get Payees (GET /banking/payees) and Get Payee Detail (GET
    /banking/payees/{payeeId}) under the Consumer Data Standards path /cds-au/v1.
    These endpoints require an active CDR consent obtained via an Accredited Data
    Recipient using the FAPI OAuth2/OIDC flow and are not callable by the public.
    This is the shared DSB Consumer Data Standards Banking API (v1.36.0) that ING
    Bank (Australia) Ltd implements as an accredited data holder, not a bank-proprietary
