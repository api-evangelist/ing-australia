apis:
- aid: ing-australia:ing-australia-cdr-product-reference-data-api
  name: ING Australia CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Consumer Data Standards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ing.com.au/open-banking.html
  baseURL: https://id.ob.ing.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.ing.com.au/pdf/CDR-policy.pdf
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#product-reference-data-apis
    type: APIReference
  - url: openapi/ing-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Product Reference Data (PRD) API mandated under
    Australia's Consumer Data Right. Exposes GET /banking/products (a paginated list
    of ING's publicly offered banking products) and GET /banking/products/{productId}
    (full product detail) under the Consumer Data Standards (CDS) path /cds-au/v1.
    Responses are versioned via the x-v request/response header. The base URI is ING
    Bank (Australia) Ltd's registered CDR publicBaseUri per the CDR Register and is
    verified live (GET /banking/products returns HTTP 200 with header x-v:4 as of
    2026-07-21). ING documents these exact endpoints on its public open-banking page.
- aid: ing-australia:ing-australia-cdr-accounts-balances-api
  name: ING Australia CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Banking
  - Accounts
  - Balances
  - Consumer Data Standards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ing.com.au/open-banking.html
  baseURL: https://id.ob.ing.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.ing.com.au/pdf/CDR-policy.pdf
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#banking-apis
    type: APIReference
  - url: openapi/ing-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized (not public) CDR Banking API surface for account
    data. Covers Get Accounts (GET /banking/accounts), Get Bulk Balances (GET/POST
    /banking/accounts/balances), Get Account Balance (GET /banking/accounts/{accountId}/balance),
    and Get Account Detail (GET /banking/accounts/{accountId}) under the Consumer Data
    Standards path /cds-au/v1. These endpoints require an active CDR consent obtained
    through an Accredited Data Recipient using the FAPI OAuth2/OIDC authorization flow;
    they are not callable by the public. This is the shared DSB Consumer Data Standards
    Banking API (v1.36.0) that every accredited data holder ADI, including ING Bank
    (Australia) Ltd, is legally required to implement, not a bank-proprietary API.
- aid: ing-australia:ing-australia-cdr-transactions-api
  name: ING Australia CDR Transactions API
  tags:
  - CDR
  - Open Banking
  - Banking
  - Transactions
  - Consumer Data Standards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ing.com.au/open-banking.html
  baseURL: https://id.ob.ing.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.ing.com.au/pdf/CDR-policy.pdf
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#banking-apis
    type: APIReference
  - url: openapi/ing-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized (not public) CDR Banking API surface for transaction
    data. Covers Get Transactions For Account (GET /banking/accounts/{accountId}/transactions)
    and Get Transaction Detail (GET /banking/accounts/{accountId}/transactions/{transactionId})
    under the Consumer Data Standards path /cds-au/v1, including standard query filters
    for date range, amount, and text search. These endpoints require an active CDR
    consent obtained via an Accredited Data Recipient using the FAPI OAuth2/OIDC flow
    and are not callable by the public. This is the shared DSB Consumer Data Standards
    Banking API (v1.36.0) that ING Bank (Australia) Ltd implements as an accredited
    data holder, not a bank-proprietary API.
- aid: ing-australia:ing-australia-cdr-direct-debits-scheduled-payments-api
