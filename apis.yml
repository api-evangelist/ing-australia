name: ING Australia
kind: company
description: ING Australia is the retail banking division of ING Bank (Australia) Limited
  (ABN 24 000 893 292), a wholly owned subsidiary of the Dutch multinational ING Groep
  N.V. headquartered in Amsterdam. Launched in 1999 as ING Direct and rebranded to
  ING in 2017, it is a branchless, digital-first direct bank offering everyday transaction
  and savings accounts, home loans, superannuation, and insurance to Australian consumers.
  It is not a customer-owned mutual; it is a foreign-owned Authorised Deposit-taking
  Institution (ADI) regulated by APRA and ASIC. As an active ADI, ING is an accredited
  data holder under Australia's Consumer Data Right (CDR / Open Banking) and exposes
  the mandatory public, unauthenticated Product Reference Data (PRD) API conforming
  to the Consumer Data Standards (CDS). Authenticated consumer-data sharing follows
  the CDR ecosystem model (OAuth2 / OIDC FAPI profile via accredited data recipients);
  ING does not operate a broad, self-serve public developer portal.
