  - url: https://consumerdatastandardsaustralia.github.io/standards/#banking-apis
    type: APIReference
  - url: openapi/ing-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized (not public) CDR Banking API surface for recurring
    money movement. Covers Get Direct Debits For Account (GET /banking/accounts/{accountId}/direct-debits),
    Get Bulk Direct Debits (GET/POST /banking/accounts/direct-debits), Get Scheduled
    Payments For Account (GET /banking/accounts/{accountId}/payments/scheduled), and
    Get Bulk Scheduled Payments (GET/POST /banking/payments/scheduled) under the
    Consumer Data Standards path /cds-au/v1. These endpoints require an active CDR
    consent obtained via an Accredited Data Recipient using the FAPI OAuth2/OIDC flow
    and are not callable by the public. This is the shared DSB Consumer Data Standards
    Banking API (v1.36.0) that ING Bank (Australia) Ltd implements as a data holder.
